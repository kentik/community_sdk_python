ata-seg="rest_markets" data-links="rest_markets>markets_bucket"><path d="M500,356 H780" class="wire arrow" marker-end="url(#limits-ah)"/><text x="640" y="348" class="elabel" text-anchor="middle">separate endpoint</text></g><g class="node fam-blue proc " data-id="rest_device"><rect x="280" y="40" width="220" height="72" rx="14"/><text x="390" y="64.0" class="nm">REST request</text><text x="390" y="81.0" class="ft">device.ListDevices</text><text x="390" y="98.0" class="ft">endpoint</text></g><g class="node fam-green proc " data-id="grpc_device"><rect x="280" y="130" width="220" height="72" rx="14"/><text x="390" y="154.0" class="nm">gRPC request</text><text x="390" y="171.0" class="ft">device.ListDevices</text><text x="390" y="188.0" class="ft">endpoint</text></g><g class="node fam-neutral hub " data-id="device_bucket"><rect x="780" y="80" width="240" height="72" rx="14"/><text x="900" y="104.0" class="nm">Shared counter</text><text x="900" y="121.0" class="ft">device list</text><text x="900" y="138.0" class="ft">REST + gRPC</text></g><g class="node fam-orange proc " data-id="rest_sites"><rect x="280" y="230" width="220" height="72" rx="14"/><text x="390" y="254.0" class="nm">REST request</text><text x="390" y="271.0" class="ft">site.ListSites</text><text x="390" y="288.0" class="ft">endpoint</text></g><g class="node fam-neutral hub " data-id="sites_bucket"><rect x="780" y="230" width="240" height="72" rx="14"/><text x="900" y="254.0" class="nm">Separate counter</text><text x="900" y="271.0" class="ft">site list</text><text x="900" y="288.0" class="ft">own budget</text></g><g class="node fam-red proc " data-id="rest_markets"><rect x="280" y="320" width="220" height="72" rx="14"/><text x="390" y="344.0" class="nm">REST request</text><text x="390" y="361.0" class="ft">site.ListSiteMarkets</text><text x="390" y="378.0" class="ft">endpoint</text></g><g class="node fam-neutral hub " data-id="markets_bucket"><rect x="780" y="320" width="240" height="72" rx="14"/><text x="900" y="344.0" class="nm">Separate counter</text><text x="900" y="361.0" class="ft">site markets</text><text x="900" y="378.0" class="ft">own budget</text></g><g class="node fam-neutral hub " data-id="probe"><rect x="20" y="180" width="180" height="72" rx="14"/><text x="110.0" y="204.0" class="nm">Rate-limit probe</text><text x="110.0" y="221.0" class="ft">read-only calls</text><text x="110.0" y="238.0" class="ft">2026-10-27</text></g></svg>